<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 380" width="100%" height="100%">
  <defs>
    <!-- Background Nebula Glow -->
    <radialGradient id="nebulaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.38"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#070914" stop-opacity="0"/>
    </radialGradient>

    <!-- Hexagon Glass Fill -->
    <radialGradient id="hexBg" cx="45%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1e2246"/>
      <stop offset="60%" stop-color="#0c0e22"/>
      <stop offset="100%" stop-color="#070817"/>
    </radialGradient>

    <!-- Hexagon Neon Border -->
    <linearGradient id="hexBorder" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="65%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Orbital Arcs Gradients -->
    <linearGradient id="arcCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="40%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="arcMagenta" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>

    <!-- Ribbon Gradients -->
    <linearGradient id="mRibbonLeft" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="40%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <linearGradient id="mRibbonCenter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="40%" stop-color="#4f46e5"/>
      <stop offset="80%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="mRibbonRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="bloomFilter" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22" result="blur1"/>
      <feGaussianBlur stdDeviation="10" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="hexGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Background Ambient Radial Nebula Glow -->
  <circle cx="220" cy="180" r="170" fill="url(#nebulaGlow)"/>

  <!-- 2. Cosmic Orbital Curved Light Rings -->
  <!-- Top-Right Swooshing Light Ribbon -->
  <path d="M 180 30 C 290 20 380 90 410 170 C 435 240 400 320 330 355"
        fill="none" stroke="url(#arcCyan)" stroke-width="4" stroke-linecap="round" opacity="0.75" filter="url(#subtleGlow)"/>
  
  <!-- Outer Subtle Echo Arc -->
  <path d="M 230 15 C 330 15 410 85 435 175"
        fill="none" stroke="url(#arcCyan)" stroke-width="1.8" stroke-linecap="round" opacity="0.4"/>

  <!-- Bottom-Left Swooshing Violet Ribbon -->
  <path d="M 270 350 C 160 360 70 290 40 210 C 15 140 50 60 120 25"
        fill="none" stroke="url(#arcMagenta)" stroke-width="4" stroke-linecap="round" opacity="0.75" filter="url(#subtleGlow)"/>

  <!-- Outer Subtle Echo Arc Left -->
  <path d="M 210 365 C 110 365 30 295 5 205"
        fill="none" stroke="url(#arcMagenta)" stroke-width="1.8" stroke-linecap="round" opacity="0.4"/>

  <!-- 3. Ambient Diffuse Halo behind the Hexagon -->
  <circle cx="180" cy="180" r="85" fill="#00f0ff" opacity="0.32" filter="url(#bloomFilter)"/>
  <circle cx="260" cy="180" r="85" fill="#ec4899" opacity="0.32" filter="url(#bloomFilter)"/>

  <!-- 4. The 3D Rounded Hexagon Badge -->
  <!-- Rounded Hexagon Base with drop shadow -->
  <g filter="url(#hexGlow)">
    <!-- Hexagon Path with rounded corners -->
    <path d="
      M 210 55
      Q 220 48 230 55
      L 325 110
      Q 335 116 335 128
      L 335 232
      Q 335 244 325 250
      L 230 305
      Q 220 312 210 305
      L 115 250
      Q 105 244 105 232
      L 105 128
      Q 105 116 115 110
      Z
    " fill="url(#hexBg)"/>

    <!-- Glowing Hexagon Neon Border -->
    <path d="
      M 210 55
      Q 220 48 230 55
      L 325 110
      Q 335 116 335 128
      L 335 232
      Q 335 244 325 250
      L 230 305
      Q 220 312 210 305
      L 115 250
      Q 105 244 105 232
      L 105 128
      Q 105 116 115 110
      Z
    " fill="none" stroke="url(#hexBorder)" stroke-width="6.5" stroke-opacity="0.95"/>
  </g>

  <!-- Specular Glass Sheen across the top of Hexagon -->
  <path d="
    M 105 128
    L 210 55
    Q 220 48 230 55
    L 335 128
    L 335 175
    Q 220 195 105 175
    Z
  " fill="#ffffff" opacity="0.07"/>

  <!-- 5. 3D Folded Ribbon 'M' Symbol Inside Hexagon -->
  <!-- Ribbon Drop Shadow -->
  <path d="M 166 235 L 198 132 Q 206 110 220 120 L 244 195 Q 248 206 256 195 L 280 120 Q 294 110 302 132 L 334 235"
        fill="none" stroke="#000000" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" opacity="0.65" filter="url(#subtleGlow)" transform="translate(0, 10)"/>

  <!-- Ribbon Gradient Strokes -->
  <g filter="url(#subtleGlow)">
    <!-- Left Leg -->
    <path d="M 164 230 L 195 130 Q 204 108 220 118 L 242 190"
          fill="none" stroke="url(#mRibbonLeft)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Center Valley to Right Peak -->
    <path d="M 230 175 L 244 192 Q 250 200 256 192 L 280 118 Q 296 108 305 130"
          fill="none" stroke="url(#mRibbonCenter)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Right Leg -->
    <path d="M 276 122 Q 296 108 305 130 L 336 230"
          fill="none" stroke="url(#mRibbonRight)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Specular Highlight on Left Shoulder -->
    <path d="M 190 138 Q 200 114 216 120"
          fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.9"/>

    <!-- Specular Highlight on Right Shoulder -->
    <path d="M 284 120 Q 298 114 306 138"
          fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>