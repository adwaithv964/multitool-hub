<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140" width="100%" height="100%">
  <defs>
    <linearGradient id="photoBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <radialGradient id="artAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#7c3aed" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#070914" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="mtn1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>

    <linearGradient id="mtn2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>

    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Blue/Purple Aura -->
  <circle cx="95" cy="80" r="60" fill="url(#artAura)"/>

  <!-- Back Secondary Photo Card (Layered Depth) -->
  <g transform="matrix(0.92 -0.22 0.32 0.88 15 28)" opacity="0.4">
    <rect x="0" y="0" width="76" height="56" rx="8" fill="#121838" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  </g>

  <!-- Front 3D Floating Photo Card -->
  <g transform="matrix(0.95 -0.20 0.28 0.92 38 32)" filter="url(#cardGlow)">
    <!-- Card Shadow -->
    <rect x="0" y="8" width="84" height="62" rx="10" fill="#000000" opacity="0.6"/>

    <!-- Card Base -->
    <rect x="0" y="0" width="84" height="62" rx="10" fill="#0e1430" stroke="url(#photoBorder)" stroke-width="2"/>

    <!-- Inner Photo Viewport -->
    <rect x="6" y="6" width="72" height="50" rx="6" fill="#070a1a"/>

    <!-- Sun / Moon in image -->
    <circle cx="24" cy="20" r="5" fill="#38bdf8" opacity="0.9"/>

    <!-- Background Mountain -->
    <polygon points="12,50 36,24 58,50" fill="url(#mtn2)"/>

    <!-- Foreground Mountain -->
    <polygon points="32,50 56,18 74,50" fill="url(#mtn1)"/>

    <!-- Specular Diagonal Glare on glass card -->
    <path d="M 6 6 L 40 6 L 16 56 L 6 56 Z" fill="#ffffff" opacity="0.12"/>
  </g>
</svg>