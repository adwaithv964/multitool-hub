<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Clapperboard Shadow -->
    <filter id="ytmpDropShadow" x="16" y="24" width="224" height="216" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <!-- Clapper Body Gradient -->
    <linearGradient id="ytmpBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242B36"/>
      <stop offset="100%" stop-color="#141820"/>
    </linearGradient>

    <!-- Conversion Arrow Gradient -->
    <linearGradient id="ytmpArrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF941F"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <!-- Audio Badge Shadow -->
    <filter id="ytmpBadgeShadow" x="156" y="156" width="84" height="84" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#ytmpDropShadow)">
    <!-- 1. Clapper Slate Main Body -->
    <rect x="42" y="86" width="160" height="106" rx="12" fill="url(#ytmpBodyGrad)" stroke="#2E3746" stroke-width="2"/>
    
    <!-- Central Video Play Triangle -->
    <circle cx="98" cy="144" r="22" fill="#11151C" stroke="#2E3746" stroke-width="1.5"/>
    <polygon points="94,134 107,144 94,154" fill="#FF941F"/>

    <!-- Subtle Waveform Bars (Audio Spectrum) -->
    <g opacity="0.85">
      <line x1="134" y1="144" x2="134" y2="144" stroke="#A855F7" stroke-width="3" stroke-linecap="round"/>
      <line x1="142" y1="136" x2="142" y2="152" stroke="#A855F7" stroke-width="3" stroke-linecap="round"/>
      <line x1="150" y1="128" x2="150" y2="160" stroke="#EC4899" stroke-width="3" stroke-linecap="round"/>
      <line x1="158" y1="134" x2="158" y2="154" stroke="#EC4899" stroke-width="3" stroke-linecap="round"/>
      <line x1="166" y1="140" x2="166" y2="148" stroke="#FF941F" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- 2. Angled Clapper Top Stick -->
    <g transform="rotate(-12 42 86)">
      <!-- Clapper Bar Base -->
      <rect x="42" y="58" width="160" height="26" rx="5" fill="#181D26" stroke="#2E3746" stroke-width="1.8"/>
      <!-- Diagonal White Stripes -->
      <polygon points="54,84 66,58 78,58 66,84" fill="#F1F5F9" fill-opacity="0.9"/>
      <polygon points="86,84 98,58 110,58 98,84" fill="#F1F5F9" fill-opacity="0.9"/>
      <polygon points="118,84 130,58 142,58 130,84" fill="#F1F5F9" fill-opacity="0.9"/>
      <polygon points="150,84 162,58 174,58 162,84" fill="#F1F5F9" fill-opacity="0.9"/>
      <polygon points="182,84 194,58 198,58 198,66 189,84" fill="#F1F5F9" fill-opacity="0.9"/>
    </g>

    <!-- Clapperboard Hinge Pin -->
    <circle cx="44" cy="86" r="4.5" fill="#FF941F"/>
  </g>

  <!-- 3. Conversion Symbol Badge (Bottom Right: Audio Note + Conversion Loop) -->
  <g filter="url(#ytmpBadgeShadow)">
    <circle cx="196" cy="188" r="26" fill="#11151C" stroke="#A855F7" stroke-width="2.5"/>
    <circle cx="196" cy="188" r="20" fill="#241B35"/>
    
    <!-- Music Note Glyph with Conversion Indicator -->
    <circle cx="192" cy="194" r="3.2" fill="#FF941F"/>
    <circle cx="202" cy="191" r="3.2" fill="#FF941F"/>
    <path d="M195 194V182L205 179V191" stroke="#FF941F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="195" y1="186" x2="205" y2="183" stroke="#FF941F" stroke-width="1.8"/>
  </g>
</svg>
