<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Folder Shadow -->
    <filter id="sendDropShadow" x="14" y="32" width="228" height="204" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <!-- Transfer Arrow Gradient -->
    <linearGradient id="sendArrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="60%" stop-color="#FF941F"/>
      <stop offset="100%" stop-color="#FDBA74"/>
    </linearGradient>

    <!-- Folder Front Flap Gradient -->
    <linearGradient id="folderFrontGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242C38"/>
      <stop offset="100%" stop-color="#151A22"/>
    </linearGradient>

    <!-- Lock Badge Shadow -->
    <filter id="sendLockShadow" x="156" y="156" width="84" height="84" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#sendDropShadow)">
    <!-- 1. Folder Back Body -->
    <path d="M40 76C40 70.4772 44.4772 66 50 66H88L104 82H198C203.523 82 208 86.4772 208 92V172C208 177.523 203.523 182 198 182H50C44.4772 182 40 177.523 40 172V76Z" fill="#181E27" stroke="#2A313D" stroke-width="2"/>
    
    <!-- Warm Orange Folder Tab Accent -->
    <path d="M50 66H88L104 82H50C44.4772 82 40 77.5228 40 72C40 68.6863 44.4772 66 50 66Z" fill="#FF941F" opacity="0.85"/>

    <!-- 2. Emerging Document Sheet (Tilted) -->
    <g transform="rotate(-6 124 116)">
      <rect x="76" y="44" width="96" height="114" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
      <!-- Sheet Document Lines -->
      <line x1="90" y1="62" x2="134" y2="62" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
      <line x1="90" y1="74" x2="158" y2="74" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="90" y1="84" x2="152" y2="84" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="90" y1="94" x2="140" y2="94" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- 3. Folder Front Flap (Angled forward for 3D look) -->
    <path d="M34 102C34 97.5817 37.5817 94 42 94H206C210.418 94 214 97.5817 214 102L204 184C204 188.418 200.418 192 196 192H46C41.5817 192 38 188.418 38 184L34 102Z" fill="url(#folderFrontGrad)" stroke="#2E3746" stroke-width="2"/>
  </g>

  <!-- 4. Dynamic Outgoing Transfer Arrow & Arc -->
  <g>
    <!-- Dashed Transfer Path -->
    <path d="M124 140C124 96 148 54 196 46" stroke="#FF941F" stroke-width="2.5" stroke-dasharray="6 6" stroke-linecap="round" opacity="0.6"/>
    
    <!-- Prominent Orange Launch Arrow Head -->
    <path d="M192 34L222 42L204 66L198 52L178 54L192 34Z" fill="url(#sendArrowGrad)"/>
  </g>

  <!-- 5. Security Indicator Badge (Bottom Right: AES-256 Lock) -->
  <g filter="url(#sendLockShadow)">
    <circle cx="196" cy="188" r="26" fill="#11151C" stroke="#3B82F6" stroke-width="2.5"/>
    <circle cx="196" cy="188" r="20" fill="#1D283A"/>
    <!-- Padlock glyph -->
    <rect x="189" y="186" width="14" height="11" rx="2.5" fill="#3B82F6"/>
    <path d="M192 186V182C192 179.791 193.791 178 196 178C198.209 178 200 179.791 200 182V186" stroke="#3B82F6" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="196" cy="191" r="1.5" fill="#FFFFFF"/>
  </g>
</svg>
