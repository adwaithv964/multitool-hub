<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Frame Shadow -->
    <filter id="metaDropShadow" x="16" y="24" width="224" height="216" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    
    <!-- Photo Sunset Sky Gradient -->
    <linearGradient id="metaSkyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="45%" stop-color="#7C2D12"/>
      <stop offset="75%" stop-color="#C2410C"/>
      <stop offset="100%" stop-color="#FF941F"/>
    </linearGradient>

    <!-- Mountain Gradients -->
    <linearGradient id="metaMtnBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9A3412"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>
    <linearGradient id="metaMtnFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451A03"/>
      <stop offset="100%" stop-color="#1C0A00"/>
    </linearGradient>

    <!-- Sun Gradient -->
    <radialGradient id="metaSunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#FDBA74"/>
      <stop offset="100%" stop-color="#FB923C" stop-opacity="0.8"/>
    </radialGradient>

    <!-- Shield Gradient -->
    <linearGradient id="metaShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
    <filter id="metaShieldShadow" x="156" y="156" width="84" height="84" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- 1. Photo Frame Base -->
  <g filter="url(#metaDropShadow)">
    <!-- Back photo frame tilted slightly -->
    <rect x="36" y="44" width="176" height="136" rx="14" fill="#1C222C" stroke="#2A313D" stroke-width="2"/>
    
    <!-- Photo Inner Area with clip path -->
    <g clip-path="url(#photoClip)">
      <rect x="42" y="50" width="164" height="124" rx="10" fill="url(#metaSkyGrad)"/>
      
      <!-- Glowing Sunset Sun -->
      <circle cx="124" cy="106" r="24" fill="url(#metaSunGrad)"/>
      
      <!-- Distant Mountain Range -->
      <polygon points="42,174 86,112 126,146 168,98 206,174" fill="url(#metaMtnBack)"/>
      
      <!-- Foreground Mountain Range -->
      <polygon points="42,174 68,142 108,126 152,154 186,134 206,174" fill="url(#metaMtnFront)"/>

      <!-- Clean Grid Scanlines (Visualizing metadata inspection) -->
      <line x1="42" y1="80" x2="206" y2="80" stroke="#FFFFFF" stroke-opacity="0.08" stroke-dasharray="4 4"/>
      <line x1="42" y1="110" x2="206" y2="110" stroke="#FFFFFF" stroke-opacity="0.08" stroke-dasharray="4 4"/>
      <line x1="42" y1="140" x2="206" y2="140" stroke="#FFFFFF" stroke-opacity="0.08" stroke-dasharray="4 4"/>
    </g>
  </g>

  <clipPath id="photoClip">
    <rect x="42" y="50" width="164" height="124" rx="10"/>
  </clipPath>

  <!-- 2. Cleaned Metadata Tags Floating on Top Left -->
  <g opacity="0.95">
    <!-- Tag 1: EXIF -->
    <rect x="24" y="32" width="58" height="22" rx="6" fill="#11151C" stroke="#FF941F" stroke-width="1.2"/>
    <text x="34" y="47" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#FF941F" letter-spacing="0.04em">EXIF</text>
    <line x1="60" y1="39" x2="72" y2="47" stroke="#22C55E" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="72" y1="39" x2="60" y2="47" stroke="#22C55E" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Tag 2: C2PA -->
    <rect x="88" y="24" width="56" height="22" rx="6" fill="#11151C" stroke="#2A313D" stroke-width="1.2"/>
    <text x="98" y="39" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#A7AFBD" letter-spacing="0.04em">C2PA</text>
  </g>

  <!-- 3. Prominent Shield & Checkmark Badge (Bottom Right) -->
  <g filter="url(#metaShieldShadow)">
    <circle cx="196" cy="188" r="26" fill="#11151C" stroke="#22C55E" stroke-width="2.5"/>
    <circle cx="196" cy="188" r="20" fill="url(#metaShieldGrad)"/>
    <!-- Checkmark icon inside shield -->
    <path d="M189 188L194 193L204 183" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
