<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mthBrandGradBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF941F"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="mthBrandGradFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>
    <filter id="mthShadow" x="-15%" y="-15%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background tilted card -->
  <rect x="7" y="13" width="26" height="26" rx="7" fill="url(#mthBrandGradBack)" transform="rotate(-7 20 26)" filter="url(#mthShadow)"/>
  <!-- Foreground front card -->
  <rect x="16" y="8" width="26" height="26" rx="7" fill="url(#mthBrandGradFront)" filter="url(#mthShadow)"/>
  <!-- Translucent inner accent card -->
  <rect x="21" y="13" width="16" height="16" rx="4" fill="#FFFFFF" fill-opacity="0.32"/>
</svg>
